<style>
:root{color-scheme:dark;--bg:#090e1b;--panel:#151b30;--panel2:#1b233b;--line:#323b53;--text:#f4f6ff;--dim:#acb6ca;--primary:#a9a0ff;--mint:#85e8cf;--danger:#ff9b9c;--warning:#f3c378}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -15%,#31315c 0,transparent 39%),radial-gradient(circle at 92% 22%,#143744 0,transparent 40%),var(--bg);color:var(--text);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.shell{max-width:1000px;margin:auto;padding:22px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:28px}.logo{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.3px}.mark{background:linear-gradient(135deg,#c3a7ff,#83e9cf);color:#0d1523;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}.tag{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--mint);text-transform:uppercase}.muted{color:var(--dim)}.hero{padding:12px 0 24px}.hero h1{font-size:clamp(35px,6vw,64px);line-height:1.08;letter-spacing:-1.8px;margin:10px 0 15px}.gradient{background:linear-gradient(90deg,#c3b2ff,#90dfd9);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{font-size:clamp(16px,2.2vw,19px);max-width:640px;color:var(--dim)}.panel{background:linear-gradient(160deg,#192139,#12182a);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 18px 65px #01051344}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:22px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:16px}.metric strong{display:block;font-size:27px;line-height:1.2}.metric span{font-size:12px;color:var(--dim)}.rules{padding-left:20px;color:var(--dim)}.rules li{margin:8px 0}.rule-important{color:var(--danger);font-weight:800}.btn{border:0;border-radius:12px;background:linear-gradient(90deg,#afa1ff,#83e0d4);color:#10162a;padding:13px 22px;font-weight:850;min-height:47px;transition:transform .15s}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.danger{background:#47252f;color:#ffd9df;border:1px solid #8a4557}.btn:disabled:hover{transform:none}.field{margin:20px 0}.field label{display:block;font-weight:750;margin-bottom:8px}.field input{width:100%;background:#0f172a;border:1px solid #46516a;border-radius:11px;color:var(--text);padding:13px 14px}.hint{font-size:13px;color:var(--dim)}.exam-head{position:sticky;top:0;z-index:5;background:#101729f2;border:1px solid #3a4563;border-radius:16px;padding:14px 18px;backdrop-filter:blur(16px);margin-bottom:17px}.exam-main{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.timer{font-weight:900;font-variant-numeric:tabular-nums;font-size:24px;color:var(--mint)}.timer.low{color:var(--danger)}.bar{height:6px;border-radius:99px;background:#384158;overflow:hidden;margin-top:13px}.bar>div{height:100%;background:linear-gradient(90deg,#a99aff,#7de6d4);transition:width .2s}.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:16px;align-items:start}.question-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.pill{border-radius:99px;border:1px solid #48516b;padding:4px 10px;color:#c6cee2;font-size:12px;font-weight:700}.q-text{font-size:clamp(20px,2.6vw,24px);font-weight:780;line-height:1.42;margin:10px 0 20px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border-radius:14px;border:1px solid #3a4661;background:#171f35;color:var(--text);padding:15px 14px;display:flex;gap:13px;align-items:flex-start}.option:hover{border-color:#aca1ff;background:#202944}.option.selected{border:2px solid var(--primary);background:#2a2948;padding:14px 13px}.letter{width:28px;height:28px;flex:none;display:grid;place-items:center;border:1px solid #62708c;border-radius:9px;font-weight:850}.selected .letter{background:var(--primary);color:#12162c;border-color:var(--primary)}.nav-actions{display:flex;justify-content:space-between;gap:9px;margin-top:22px;flex-wrap:wrap}.side h3{margin:0 0 9px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.nbtn{height:34px;min-width:0;border:1px solid #4d5772;background:#1a2238;color:#c7d0e1;border-radius:8px;font-size:12px;font-weight:800}.nbtn.answered{background:#275f60;border-color:#65b9ae;color:white}.nbtn.current{outline:2px solid #b8a8ff;outline-offset:1px}.data-box{background:#10192c;border:1px solid #40506b;padding:15px;border-radius:12px;margin:16px 0;white-space:pre-line;font-size:14px;line-height:1.7;color:#d6ddef}.data-box p{margin:0 0 10px}.data-box p:last-child{margin-bottom:0}.data-table{width:100%;border-collapse:collapse;white-space:normal}.data-table th,.data-table td{border:1px solid #536078;padding:7px;text-align:left}.data-table th{background:#273249}.center{text-align:center}.big-icon{font-size:58px;line-height:1.15;margin-bottom:8px}.result-score{font-size:clamp(56px,13vw,92px);line-height:1.2;font-weight:900;color:var(--mint);margin:14px 0}.section-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}.section-result{border-radius:12px;border:1px solid var(--line);padding:10px}.section-result strong{display:block}.foot{margin-top:30px;color:#93a2bb;font-size:12px}.hidden{display:none!important}@media(max-width:700px){.exam-layout{grid-template-columns:1fr}.side{order:0}.numbers{grid-template-columns:repeat(10,1fr)}.nbtn{height:33px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:38px}.top{margin-bottom:17px}.shell{padding-top:14px}.side .hint{display:none}.exam-head{top:6px}.section-results{grid-template-columns:1fr 1fr}}@media(max-width:390px){.numbers{grid-template-columns:repeat(8,1fr)}.btn{padding:11px 13px}}

<div class="shell"><header class="top"><div class="logo"><span class="mark">✦</span><span>SAKSHI<span style="color:var(--primary)">.EXAM</span></span></div><span class="pill">RBSE • 2026–27</span></header><main id="app"></main><footer class="foot">Made for Sakshi • Class 10 English practice • 1 mark/question • No negative marking</footer></div>
<script>
'use strict';
const QUESTIONS = [{"section":"Reading Comprehension","question":"Which conclusion is best supported by the passage?","options":["Digital reading always improves comprehension.","Printed books are no longer useful.","All students prefer digital books.","A fall in printed-book borrowing does not necessarily indicate less reading."],"answer":3},{"section":"Reading Comprehension","question":"The central argument is that:","options":["Technology should replace traditional libraries.","Reading habits should be evaluated through multiple measures.","The number of visitors proves academic success.","Digital resources are more reliable than printed ones."],"answer":1},{"section":"Reading Comprehension","question":"Which expression best describes printed-book borrowing as a measure of reading activity?","options":["An indirect indicator","An unquestionable proof","A final conclusion","An irrelevant observation"],"answer":0},{"section":"Reading Comprehension","question":"Which additional evidence would most effectively address the director's uncertainty?","options":["The amount spent on digital devices","The number of chairs in the centre","The popularity of the centre's website","Reading-comprehension results collected before and after the programme"],"answer":3},{"section":"Reading Comprehension","question":"The residents' conclusion depends mainly on the assumption that:","options":["Digital books are expensive.","Printed-book borrowing accurately represents overall reading activity.","All visitors are school students.","Historical documents are difficult to understand."],"answer":1},{"section":"Reading Comprehension","question":"Which centres recorded the same percentage increase?","options":["A and C","A and B","B and C","All three"],"answer":0},{"section":"Reading Comprehension","question":"What was the total increase in daily attendance across all three centres?","options":["114","119","124","129"],"answer":3},{"section":"Reading Comprehension","question":"Which centre had the highest attendance in 2025?","options":["Centre A","Centre B","Centre C","All had equal attendance."],"answer":1},{"section":"Reading Comprehension","question":"Which conclusion cannot be established from the data?","options":["Attendance increased at every centre.","Centre B had the smallest percentage increase.","Students' reading comprehension improved.","Centre A had the greatest absolute increase."],"answer":2},{"section":"Reading Comprehension","question":"Approximately what percentage was the overall attendance increase?","options":["25%","35%","45%","55%"],"answer":1},{"section":"Writing Skills","question":"Which subject line is most appropriate for a formal complaint letter to municipal authorities?","options":["Our Street Is Terrible!","Request for Repair of Faulty Streetlights on Park Road","Why Are You Doing Nothing?","Something Very Important"],"answer":1},{"section":"Writing Skills","question":"A survey shows that 40% of students prefer Science, 30% Art, 20% Sports and 10% Music. Which statement is the most objective analytical observation?","options":["Science is undoubtedly the most useful subject.","Students who prefer Music are less talented.","Schools should remove Music from the curriculum.","Science received the highest preference, while Music received the lowest."],"answer":3},{"section":"Writing Skills","question":"Which opening is most suitable for a formal letter requesting permission from a principal?","options":["I am writing to request permission to organise an educational exhibition.","Hey, we have a great plan!","You must allow us to organise an exhibition.","I thought I would casually ask you something."],"answer":0},{"section":"Writing Skills","question":"Which sequence demonstrates the clearest cause-and-effect structure in a short story?","options":["A prize was awarded → A student entered a competition → The student began practising.","A student lost a wallet → A stranger returned it → The student's trust in others increased.","The sun set → A student ate breakfast → An examination started.","A student celebrated → An examination was announced → A book was purchased."],"answer":1},{"section":"Grammar","question":"Neither the principal nor the teachers ______ present at yesterday's meeting.","options":["was","were","is","has been"],"answer":1},{"section":"Grammar","question":"Each of the proposals ______ been examined carefully.","options":["has","have","are","were"],"answer":0},{"section":"Grammar","question":"Change into reported speech: She said, “I have been waiting here since morning.”","options":["She said that she has been waiting here since morning.","She said that she was waiting here from morning.","She said that she had been waiting there since morning.","She said that she waited there since morning."],"answer":2},{"section":"Grammar","question":"Change into reported speech: The teacher said to me, “Do not interrupt the speaker.”","options":["The teacher said that I did not interrupt the speaker.","The teacher asked me that I should not interrupt the speaker.","The teacher told me that do not interrupt the speaker.","The teacher told me not to interrupt the speaker."],"answer":3},{"section":"Grammar","question":"By the time the committee arrives, we ______ the report.","options":["will have completed","will complete","had completed","have been completing"],"answer":0},{"section":"Grammar","question":"______ little evidence we have points towards a different conclusion.","options":["A","An","The","Many"],"answer":2},{"section":"Grammar","question":"Hardly ______ the lecture begun when the lights went out.","options":["has","had","did","was"],"answer":1},{"section":"Grammar","question":"One of the students who ______ qualified for the final round ______ absent today.","options":["has, are","has, is","have, are","have, is"],"answer":3},{"section":"First Flight","question":"A Letter to God — What contradiction is most clearly revealed by Lencho's response to the money he receives?","options":["He trusts human kindness but doubts God.","He maintains absolute faith in God while suspecting the people who helped him.","He loses faith in both God and his neighbours.","He believes that the postmaster controls the weather."],"answer":1},{"section":"First Flight","question":"Nelson Mandela: Long Walk to Freedom — Mandela's understanding of freedom suggests that:","options":["The freedom of the individual is connected to the freedom and dignity of others.","Political freedom automatically removes all prejudice.","Personal success is more important than national responsibility.","Only those who suffer oppression need to change."],"answer":0},{"section":"First Flight","question":"Two Stories about Flying — In The Black Aeroplane, what makes the mysterious pilot's assistance especially puzzling?","options":["The narrator never encountered bad weather.","The pilot demanded a reward after landing.","The control tower reported no other aircraft in the sky.","The narrator had already landed before seeing the aircraft."],"answer":2},{"section":"First Flight","question":"From the Diary of Anne Frank — Why does Anne feel the need to maintain a diary despite having people around her?","options":["She wants to become a famous novelist immediately.","She has been forbidden to speak at home.","She wants to record only her academic achievements.","She lacks someone with whom she can share her deepest feelings."],"answer":3},{"section":"First Flight","question":"Glimpses of India — In the account of the Goan baker, the continuing importance of bread mainly illustrates:","options":["The survival of a cultural tradition connected with social celebrations.","The disappearance of all Portuguese influences.","The replacement of traditional occupations by machines.","The rejection of bread by younger generations."],"answer":0},{"section":"First Flight","question":"Mijbil the Otter — Mijbil's repeated experiments with water and everyday objects primarily reveal his:","options":["Fear of unfamiliar surroundings","Dependence on strict discipline","Curiosity and playful intelligence","Dislike of human interaction"],"answer":2},{"section":"First Flight","question":"Madam Rides the Bus — How does Valli's response to the dead cow change the emotional significance of her journey?","options":["It makes her regret learning about buses.","It introduces an awareness of life's uncertainty into her joyful adventure.","It convinces her that travelling is always dangerous.","It removes her desire to return home."],"answer":1},{"section":"First Flight","question":"The Sermon at Benares — What does Kisa Gotami's unsuccessful search for mustard seeds teach her?","options":["Religious rituals can prevent every misfortune.","Wealth determines how long people live.","Grief can be overcome simply by ignoring it.","Death is universal and cannot be avoided through individual wishes."],"answer":3},{"section":"First Flight","question":"The Proposal — The repeated arguments between Lomov and Natalya mainly expose:","options":["The importance of scientific reasoning","Human pride and trivial disputes overshadowing an important personal decision","The complete absence of marriage traditions","The superiority of friendship over family relationships"],"answer":1},{"section":"First Flight","question":"Dust of Snow — Why are the crow and the hemlock tree significant to the poem's message?","options":["They show that even unexpected and seemingly unpleasant things can bring positive change.","They prove that nature is always threatening.","They represent wealth and social position.","They suggest that happiness is impossible without human company."],"answer":0},{"section":"First Flight","question":"Fire and Ice — What is the most accurate interpretation of the contrasting symbols?","options":["Fire represents knowledge and ice represents peace.","Fire is harmless, whereas ice is destructive.","Desire and hatred can both become destructive forces.","The poem is exclusively about changing weather conditions."],"answer":2},{"section":"First Flight","question":"A Tiger in the Zoo — The contrast between the tiger's actual confinement and his imagined natural life emphasises:","options":["The advantages of captivity","The tiger's inability to survive in forests","The need to train wild animals","The loss of freedom and natural dignity"],"answer":3},{"section":"First Flight","question":"How to Tell Wild Animals — How does the poet mainly create humour?","options":["By explaining animal biology through formal definitions","By presenting dangerous encounters as absurd methods of identifying animals","By arguing that all wild animals are harmless","By avoiding exaggeration entirely"],"answer":1},{"section":"First Flight","question":"The Ball Poem — Why is simply replacing the lost ball inadequate?","options":["The boy has forgotten how to play.","The original ball was expensive.","The experience involves learning about loss, which money cannot undo.","The poet believes that children should never receive gifts."],"answer":2},{"section":"First Flight","question":"Amanda! — Amanda's imaginary worlds primarily serve as:","options":["Expressions of her desire for personal freedom and escape from constant instructions","Evidence that she cannot understand reality","Proof that her parents never speak to her","Plans for actual journeys she has already arranged"],"answer":0},{"section":"First Flight","question":"The Trees — The movement of trees from the house into the forest can most strongly be interpreted as:","options":["The destruction of every human settlement","The struggle to recover freedom from confinement","The superiority of buildings over natural spaces","A warning against growing indoor plants"],"answer":1},{"section":"First Flight","question":"Fog — The comparison between fog and a cat emphasises the fog's:","options":["Loud and violent movement","Predictable arrival at a fixed hour","Permanent occupation of the city","Quiet arrival, temporary presence and silent departure"],"answer":3},{"section":"First Flight","question":"The Tale of Custard the Dragon — What central contrast does Custard's behaviour establish?","options":["Genuine courage is demonstrated by actions rather than loud claims.","Fearful appearances always indicate cowardice.","Physical strength guarantees bravery in everyone.","Those who boast are always the most dependable."],"answer":0},{"section":"First Flight","question":"For Anne Gregory — What distinction lies at the centre of the poem?","options":["Wealth and poverty","Youth and old age","Attraction to outward appearance and appreciation of a person's inner self","Education and ignorance"],"answer":2},{"section":"Footprints Without Feet","question":"A Triumph of Surgery — What was the fundamental reason for Tricki's poor health?","options":["A rare disease requiring surgery","Excessive feeding and insufficient physical activity","A dangerous infection","A complete refusal to eat"],"answer":1},{"section":"Footprints Without Feet","question":"The Thief's Story — Why does Hari Singh ultimately return the stolen money?","options":["He recognises the value of Anil's trust and the opportunity to learn.","Anil has threatened to report him.","The stolen notes have become worthless.","He has already spent most of the money."],"answer":0},{"section":"Footprints Without Feet","question":"The Midnight Visitor — What makes Ausable's strategy against Max successful?","options":["His extraordinary physical strength","A secret weapon concealed in the room","His convincing invention of a balcony and use of the knock at the door","His ability to contact the police through a hidden telephone"],"answer":2},{"section":"Footprints Without Feet","question":"A Question of Trust — How is Horace Danby deceived?","options":["A police officer discovers him immediately.","The safe is already empty.","His employer unexpectedly returns home.","A woman pretends to be the owner and persuades him to open the safe."],"answer":3},{"section":"Footprints Without Feet","question":"Footprints Without Feet — Griffin's conduct most strongly demonstrates that:","options":["Scientific discoveries automatically produce good character.","Social rejection justifies every unlawful act.","Scientific brilliance without ethical responsibility can become dangerous.","Invisibility prevents a person from making moral choices."],"answer":2},{"section":"Footprints Without Feet","question":"The Making of a Scientist — Which combination best explains Richard Ebright's development as a scientist?","options":["Memorising facts and avoiding experiments","Curiosity, encouragement and disciplined scientific investigation","Luck without systematic effort","Collecting butterflies without asking scientific questions"],"answer":1},{"section":"Footprints Without Feet","question":"The Necklace — Which fact creates the story's most important irony?","options":["Matilda always knew the necklace was inexpensive.","The replacement necklace was cheaper than the original.","Matilda never borrowed any jewellery.","The original necklace was imitation jewellery, making years of hardship tragically unnecessary."],"answer":3},{"section":"Footprints Without Feet","question":"Bholi — What does Bholi's rejection of Bishamber's marriage proposal most clearly demonstrate?","options":["Education has strengthened her confidence and sense of self-respect.","She believes marriage is forbidden.","She wants to punish her teacher.","She no longer respects any member of her family."],"answer":0},{"section":"Footprints Without Feet","question":"The Book That Saved the Earth — How does Think-Tank's misunderstanding of books contribute to the Martians' decision?","options":["He correctly identifies a military attack from Earth.","His mistaken interpretation of nursery rhymes makes Earth seem threatening.","He discovers Earth's actual defence strategy.","He learns that books contain instructions for building spacecraft."],"answer":1}];
const PASSAGES = {"first": "A town introduced a digital study centre to encourage reading. Within six months, the number of visitors increased by 30%, while the number of printed books borrowed fell by 12%. Some residents concluded that students were losing interest in reading. However, a survey revealed that many visitors were accessing digital books, researching historical documents and comparing information from different websites.\n\nThe centre's director argued that the number of printed books borrowed was an incomplete measure of reading activity. She recommended evaluating reading habits, information literacy and the ability to distinguish reliable evidence from misleading claims. Nevertheless, she admitted that the survey could not establish whether students' overall comprehension had improved. For that, more systematic assessment would be required.", "second": "The table below shows average daily attendance at three school reading centres.\n\nCentre A: 2025 — 120; 2026 — 180\nCentre B: 2025 — 160; 2026 — 184\nCentre C: 2025 — 90; 2026 — 135"};
const KEY = 'sakshi-rbse-english-hard-v1';
const DURATION_MS = 60 * 60 * 1000;
const SECTIONS = ['Reading Comprehension','Writing Skills','Grammar','First Flight','Footprints Without Feet'];
const app = document.getElementById('app');
let state = null;
let current = 0;
let ticker = null;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function store(){try{localStorage.setItem(KEY, JSON.stringify(state));}catch(e){console.warn('Storage unavailable',e);}}
function retrieve(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}
function countAnswered(){return state.answers.filter(x=>x!==null).length;}
function timeLeft(){return Math.max(0,DURATION_MS-(Date.now()-state.startedAt));}
function renderWelcome(){
 app.innerHTML=`<section class="hero"><span class="tag">The final English challenge</span><h1>Ready to prove it, <span class="gradient">Sakshi?</span> ✨</h1><p class="lead">Hard-level Class 10 English challenge based on the RBSE syllabus. Concentration, confidence and 50 tricky questions.</p></section><section class="panel"><div class="metric-grid"><div class="metric"><strong>50</strong><span>MCQ questions</span></div><div class="metric"><strong>50</strong><span>Total marks</span></div><div class="metric"><strong>60m</strong><span>Time limit</span></div><div class="metric"><strong>Hard</strong><span>Difficulty</span></div></div><h2>Exam instructions</h2><ol class="rules"><li>Every correct answer earns 1 mark. There is no negative marking.</li><li>Only one attempt is permitted on this browser.</li><li class="rule-important">Pressing Back, refreshing the page, leaving the test tab/app, or switching screens ends your attempt.</li><li>If you finish early, use the Submit button to see your score and share your report.</li><li>Questions 1–10 include reading passages and data for reference.</li></ol><div class="field"><label for="student-name">Student name</label><input id="student-name" autocomplete="name" maxlength="45" value="Sakshi" placeholder="Enter your name"/></div><button class="btn" id="start" style="width:100%">Start my test →</button><p class="hint center">Starting means you accept the one-attempt rule. Keep this screen open until submission.</p></section>`;
 document.getElementById('start').onclick=()=>{const name=document.getElementById('student-name').value.trim()||'Sakshi';state={status:'active',name,startedAt:Date.now(),answers:Array(50).fill(null)};store();history.pushState({exam:true},'',location.href);current=0;renderExam();ticker=setInterval(tick,1000);};
}
function getPassage(i){if(i>=0&&i<=4)return `<div class="data-box"><strong>Reading passage for Q1–5</strong><p>${safe(PASSAGES.first).replace(/\n\n/g,'</p><p>')}</p></div>`;if(i>=5&&i<=9)return `<div class="data-box"><strong>Data for Q6–10</strong><p>The table shows average daily attendance at three school reading centres.</p><table class="data-table"><thead><tr><th>Centre</th><th>2025</th><th>2026</th></tr></thead><tbody><tr><td>A</td><td>120</td><td>180</td></tr><tr><td>B</td><td>160</td><td>184</td></tr><tr><td>C</td><td>90</td><td>135</td></tr></tbody></table></div>`;return '';}
function renderExam(){
 if(!state||state.status!=='active')return;
 if(timeLeft()===0){submit('time');return;}
 const q=QUESTIONS[current],answered=countAnswered();
 app.innerHTML=`<section class="exam-head"><div class="exam-main"><div><span class="tag">English challenge</span><div><strong>${safe(state.name)}</strong><span class="muted"> • Question ${current+1}/50</span></div></div><div><span class="muted" style="font-size:12px">Time remaining</span><div class="timer" id="timer">60:00</div></div></div><div class="bar"><div style="width:${answered*2}%"></div></div><div class="hint" style="margin-top:6px">${answered} of 50 answered</div></section><div class="exam-layout"><section class="panel"><div class="question-head"><span class="pill">Question ${current+1} • 1 mark</span><span class="pill">${safe(q.section)}</span></div>${getPassage(current)}<div class="q-text">${safe(q.question)}</div><div class="options">${q.options.map((option,i)=>`<button class="option ${state.answers[current]===i?'selected':''}" data-answer="${i}" aria-pressed="${state.answers[current]===i}"><span class="letter">${'ABCD'[i]}</span><span>${safe(option)}</span></button>`).join('')}</div><div class="nav-actions"><button id="prev" class="btn secondary" ${current===0?'disabled':''}>← Previous</button><button id="next" class="btn" ${current===49?'disabled':''}>Next →</button></div></section><aside class="panel side"><h3>Question map</h3><div class="muted" style="font-size:13px">Tap a number to jump.</div><div class="numbers">${QUESTIONS.map((_,i)=>`<button class="nbtn ${state.answers[i]!==null?'answered':''} ${i===current?'current':''}" data-jump="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><div style="margin-top:20px"><button class="btn danger" style="width:100%" id="submit">Finish & submit</button><p class="hint">Submit only when you're done. You cannot restart.</p></div></aside></div>`;
 document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{state.answers[current]=Number(btn.dataset.answer);store();renderExam();});
 document.querySelectorAll('[data-jump]').forEach(btn=>btn.onclick=()=>{current=Number(btn.dataset.jump);renderExam();scrollTo({top:0,behavior:'smooth'});});
 document.getElementById('prev').onclick=()=>{if(current>0){current--;renderExam();scrollTo({top:0,behavior:'smooth'});}};
 document.getElementById('next').onclick=()=>{if(current<49){current++;renderExam();scrollTo({top:0,behavior:'smooth'});}};
 document.getElementById('submit').onclick=()=>{const n=50-countAnswered();if(confirm(n?`You have ${n} unanswered question(s). Submit anyway?`:'Submit your test now? This cannot be undone.'))submit('submitted');};
 updateTimer();
}
function updateTimer(){if(!state||state.status!=='active')return;const el=document.getElementById('timer');if(!el)return;let t=Math.ceil(timeLeft()/1000);let mm=String(Math.floor(t/60)).padStart(2,'0'),ss=String(t%60).padStart(2,'0');el.textContent=`${mm}:${ss}`;el.classList.toggle('low',t<=300);}
function tick(){if(!state||state.status!=='active'){clearInterval(ticker);return;}if(timeLeft()===0)submit('time');else updateTimer();}
function submit(reason){if(!state||state.status!=='active')return;state.status='submitted';state.endedAt=Date.now();state.finishReason=reason;state.score=state.answers.reduce((sum,a,i)=>sum+(a===QUESTIONS[i].answer?1:0),0);store();clearInterval(ticker);renderResult();}
function closeTest(reason){if(!state||state.status!=='active')return;state.status='terminated';state.endedAt=Date.now();state.finishReason=reason;store();clearInterval(ticker);renderClosed();}
function report(){let out=[`SAKSHI'S ENGLISH CHALLENGE — RBSE CLASS 10`,`Name: ${state.name}`,`Status: ${state.finishReason==='time'?'Time finished':'Submitted'}`,`Score: ${state.score}/50 (${state.score*2}%)`,`Answered: ${countAnswered()}/50`,`Date: ${new Date(state.endedAt).toLocaleString('en-IN')}`];for(const s of SECTIONS){let ids=QUESTIONS.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0);let n=ids.filter(i=>state.answers[i]===QUESTIONS[i].answer).length;out.push(`${s}: ${n}/${ids.length}`);}return out.join('\n');}
async function share(){const t=report();try{if(navigator.share){await navigator.share({title:'My English Test Score',text:t});return;}}catch(e){if(e.name==='AbortError')return;}try{await navigator.clipboard.writeText(t);alert('Result copied! Send it to your teacher.');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Result copied!');}}
function renderResult(){const sections=SECTIONS.map(s=>{const ids=QUESTIONS.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0);return {name:s,total:ids.length,correct:ids.filter(i=>state.answers[i]===QUESTIONS[i].answer).length};});app.innerHTML=`<section class="panel center" style="max-width:680px;margin:40px auto"><div class="big-icon">🏆</div><div class="tag">Test completed</div><h1>Well done, ${safe(state.name)}!</h1><p class="muted">${state.finishReason==='time'?'Your 60-minute time limit has ended.':'Your answers have been submitted.'}</p><div class="result-score">${state.score}/50</div><h2>${state.score*2}%</h2><p class="muted">Answered ${countAnswered()} of 50 questions • ${50-state.score} marks not earned</p><div class="section-results">${sections.map(s=>`<div class="section-result"><div class="hint">${safe(s.name)}</div><strong>${s.correct}/${s.total}</strong></div>`).join('')}</div><button id="share" class="btn" style="width:100%">↗ Share / Copy Result</button><p class="hint">Your response is saved on this device. No automatic message is sent to the teacher.</p></section>`;document.getElementById('share').onclick=share;}
function renderClosed(){app.innerHTML=`<section class="panel center" style="max-width:650px;margin:70px auto"><div class="big-icon">🔒</div><span class="tag" style="color:var(--danger)">Attempt ended</span><h1>Test Closed</h1><p class="lead" style="margin:12px auto">The test was closed because the Back button, another screen, a refresh, or navigation away from the exam was detected.</p><p class="muted">To keep the one-attempt rule fair, you cannot reopen or resume this test in this browser. Please contact your teacher.</p><div class="pill" style="display:inline-block;margin-top:12px">Status: Not submitted</div></section>`;}
// Enforce one-attempt exam: closing, switching tabs/apps and navigating away ends it.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')closeTest('screen_switch');});
window.addEventListener('pagehide',()=>closeTest('page_exit'));
window.addEventListener('popstate',()=>{if(state?.status==='active'){closeTest('back');history.pushState({examClosed:true},'',location.href);}});
function boot(){const old=retrieve();if(!old){renderWelcome();return;}state=old;if(state.status==='active'){closeTest('reload');return;}if(state.status==='submitted'){renderResult();return;}renderClosed();}
boot();
</script></body></html>
